name: Build Gestion Electriciens V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Gestion_Electriciens_V2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract V2 project
        run: |
          unzip -o Gestion_Electriciens_V2.zip -d .
          cd Gestion_Electriciens_V2
          flutter create . --platforms=android --org com.gestion.electriciens

      - name: Install dependencies
        working-directory: Gestion_Electriciens_V2
        run: flutter pub get

      - name: Build APK
        working-directory: Gestion_Electriciens_V2
        run: flutter build apk --release

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Electriciens-V2-APK
          path: Gestion_Electriciens_V2/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
