
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'gestion_electriciens_flutter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir appsrc
          unzip -q gestion_electriciens_flutter.zip -d appsrc
          PROJECT_DIR=$(find appsrc -name pubspec.yaml -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Prepare Android project
        run: |
          cd "$PROJECT_DIR"
          rm -rf android
          flutter create . --platforms=android --org com.gestion.electriciens

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Electriciens-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
